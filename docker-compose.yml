services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - chainproof-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chainproof-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chainproof:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/chainproof
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell or local .env file}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
    ports:
      - "${APP_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - chainproof-internal

volumes:
  chainproof-mongo-data:

networks:
  chainproof-internal:
    internal: false
