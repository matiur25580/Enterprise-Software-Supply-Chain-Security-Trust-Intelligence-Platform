name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/chainproof_test?replicaSet=rs0
      AUTH_SESSION_SECRET: ci-only-secret-that-is-long-enough-for-testing-123456
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.1
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Start MongoDB replica set
        run: |
          docker run -d --name chainproof-mongo -p 27017:27017 mongo:8.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec chainproof-mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1; then break; fi
            sleep 2
          done
          docker exec chainproof-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec chainproof-mongo mongosh --quiet --eval "rs.status().ok" | grep -q 1; then break; fi
            sleep 2
          done
      - name: Typecheck
        run: pnpm typecheck
      - name: Identity and auth security tests
        run: pnpm --filter @chainproof/api test
      - name: Build
        run: pnpm build
