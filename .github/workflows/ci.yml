name: ChainProof CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run API and frontend tests
        run: npm test
      - name: Type-check API and web
        run: npm run typecheck
      - name: Build API and web
        run: npm run build
      - name: Build production container image
        run: docker build --tag chainproof-ci .
