name: ChainProof CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run mocked unit tests
        run: npm test
      - name: Run real MongoDB integration tests
        run: npm run test:integration
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/chainproof_ci
      - name: Type-check API and web
        run: npm run typecheck
      - name: Build API and web
        run: npm run build
      - name: Build production container image
        run: docker build --tag chainproof-ci .
